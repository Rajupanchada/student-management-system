<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

	<title>Update Page</title>

	<style>
		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.container {
			background: rgba(255, 255, 255, 0.97);
			border-radius: 30px;
			padding: 50px;
			box-shadow: 0 25px 70px rgba(0,0,0,0.3);
			margin: 40px 20px;
			animation: slideIn 0.8s ease-out;
			max-width: 700px;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(40px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.home-btn {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border: none;
			padding: 12px 20px;
			border-radius: 15px;
			transition: all 0.3s ease;
			box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
			margin-bottom: 25px;
			display: inline-block;
			text-decoration: none;
		}

		.home-btn:hover {
			transform: translateY(-3px);
			box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
		}

		.home-btn i {
			color: white;
			font-size: 1.8rem;
		}

		h1 {
			background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			font-weight: 800;
			font-size: 2.8rem;
			margin-bottom: 40px;
			text-align: center;
		}

		.form-label {
			font-weight: 600;
			color: #2c3e50;
			margin-bottom: 8px;
			font-size: 1.05rem;
		}

		.form-control {
			border: 2px solid rgba(250, 112, 154, 0.3);
			border-radius: 15px;
			padding: 12px 18px;
			transition: all 0.3s ease;
			font-size: 1rem;
		}

		.form-control:focus {
			border-color: #fa709a;
			box-shadow: 0 0 0 0.2rem rgba(250, 112, 154, 0.25);
			transform: translateY(-2px);
		}

		.mb-3 {
			margin-bottom: 25px;
			animation: fadeInUp 0.6s ease-out backwards;
		}

		.mb-3:nth-child(2) { animation-delay: 0.1s; }
		.mb-3:nth-child(3) { animation-delay: 0.2s; }
		.mb-3:nth-child(4) { animation-delay: 0.3s; }
		.mb-3:nth-child(5) { animation-delay: 0.4s; }
		.mb-3:nth-child(6) { animation-delay: 0.5s; }

		@keyframes fadeInUp {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.btn-success {
			background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
			border: none;
			padding: 15px 50px;
			border-radius: 25px;
			font-weight: 700;
			font-size: 1.15rem;
			transition: all 0.3s ease;
			box-shadow: 0 8px 20px rgba(250, 112, 154, 0.4);
			width: 100%;
			margin-top: 15px;
			text-transform: uppercase;
			letter-spacing: 1px;
			color: white;
		}

		.btn-success:hover {
			transform: translateY(-3px);
			box-shadow: 0 12px 30px rgba(250, 112, 154, 0.6);
			background: linear-gradient(135deg, #f85a8c 0%, #fdd830 100%);
		}

		.form-control::placeholder {
			color: #95a5a6;
			font-style: italic;
		}
	</style>
</head>

<body>
	<div class="container mt-5"><br>
		
		<a th:href="@{/}" class="btn home-btn">
			<i class="bi bi-house-fill"></i>
		</a>
		<h1><b>Student Update Form</b></h1>

		<form class="col-12" th:action="@{/saveStudent}" th:object="${student}" method="post">

			<input hidden="hidden" th:field="*{id}" />

			<div class="mb-3">
				<label for="Input2" class="form-label">
					<i class="bi bi-person-fill"></i> Student Name
				</label>
				<input type="text" class="form-control" placeholder="Enter student name" th:field="*{name}">
			</div>
			<div class="mb-3">
				<label for="Input3" class="form-label">
					<i class="bi bi-envelope-fill"></i> Email
				</label>
				<input type="email" class="form-control" placeholder="Enter email address" th:field="*{email}">
			</div>
			<div class="mb-3">
				<label for="Input4" class="form-label">
					<i class="bi bi-book-fill"></i> Course
				</label>
				<input type="text" class="form-control" placeholder="Enter course name" th:field="*{course}">
			</div>
			<div class="mb-3">
				<label for="Input5" class="form-label">
					<i class="bi bi-calendar-fill"></i> Age
				</label>
				<input type="number" class="form-control" placeholder="Enter age" th:field="*{age}">
			</div>
			<div class="mb-3">
				<label for="Input6" class="form-label">
					<i class="bi bi-geo-alt-fill"></i> Address
				</label>
				<input type="text" class="form-control" placeholder="Enter address" th:field="*{address}">
			</div>

			<button type="submit" class="btn btn-success">
				<i class="bi bi-check-circle-fill"></i> Update Student
			</button>
		</form>
	</div>
</body>

</html>
