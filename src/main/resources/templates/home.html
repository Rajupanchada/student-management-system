<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

	<title>Home Page</title>

	<style>
		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		.container {
			background: rgba(255, 255, 255, 0.95);
			border-radius: 25px;
			padding: 40px;
			box-shadow: 0 20px 60px rgba(0,0,0,0.3);
			margin-top: 30px;
			margin-bottom: 30px;
			animation: fadeIn 0.8s ease-out;
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(30px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.home-btn {
			background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
			border: none;
			padding: 12px 20px;
			border-radius: 15px;
			transition: all 0.3s ease;
			box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
		}

		.home-btn:hover {
			transform: translateY(-3px);
			box-shadow: 0 8px 25px rgba(245, 87, 108, 0.6);
		}

		.home-btn i {
			color: white;
		}

		h2 {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			font-weight: 800;
			font-size: 2.5rem;
			margin-bottom: 30px;
			text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
		}

		.btn-primary {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			border: none;
			padding: 10px 25px;
			border-radius: 25px;
			font-weight: 600;
			transition: all 0.3s ease;
			box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
		}

		.btn-primary:hover {
			transform: translateY(-3px);
			box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
		}

		.table {
			background: white;
			border-radius: 15px;
			overflow: hidden;
			box-shadow: 0 10px 30px rgba(0,0,0,0.1);
		}

		.table thead {
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
		}

		.table thead th {
			border: none;
			padding: 18px;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 1px;
			font-size: 0.9rem;
		}

		.table tbody tr {
			transition: all 0.3s ease;
			border-bottom: 1px solid rgba(0,0,0,0.05);
		}

		.table tbody tr:hover {
			background: linear-gradient(90deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
			transform: scale(1.01);
		}

		.table tbody td, .table tbody th {
			padding: 15px;
			vertical-align: middle;
		}

		.table tbody th {
			background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			font-weight: 700;
		}

		.btn-sm {
			border-radius: 20px;
			padding: 8px 20px;
			font-weight: 600;
			transition: all 0.3s ease;
			border: none;
			margin: 0 3px;
		}

		.table .btn-primary {
			background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
			box-shadow: 0 4px 10px rgba(79, 172, 254, 0.4);
		}

		.table .btn-primary:hover {
			box-shadow: 0 6px 15px rgba(79, 172, 254, 0.6);
		}

		.table .btn-danger {
			background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
			box-shadow: 0 4px 10px rgba(245, 87, 108, 0.4);
		}

		.table .btn-danger:hover {
			box-shadow: 0 6px 15px rgba(245, 87, 108, 0.6);
		}

		.header-section {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
			flex-wrap: wrap;
			gap: 15px;
		}
	</style>
</head>

<body>
	<div class="container mt-5"><br>
		<a th:href="@{/}" class="btn home-btn btn-sm mb-3">
			<i class="bi bi-house-fill fs-1"></i>
		</a>
		
		<div class="header-section">
			<h2><b>Student Details</b></h2>
			<a th:href="@{/saveStudentPage}" class="btn btn-primary btn-sm">
				<i class="bi bi-person-plus-fill"></i> Add Student
			</a>
		</div>

		<table class="table">
			<thead>
				<tr>
					<th scope="col">S_ID</th>
					<th scope="col">S_NAME</th>
					<th scope="col">EMAIL</th>
					<th scope="col">COURSE</th>
					<th scope="col">AGE</th>
					<th scope="col">ADDRESS</th>
					<th scope="col">ACTION</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="student : ${studentlist}">
					<th th:text="${student.id}" scope="row"></th>
					<td th:text="${student.name}"></td>
					<td th:text="${student.email}"></td>
					<td th:text="${student.course}"></td>
					<td th:text="${student.age}"></td>
					<td th:text="${student.address}"></td>
					<td>
						<a th:href="@{/updateStudentPage/{id}(id=${student.id})}"
							class="btn btn-primary btn-sm">
							<i class="bi bi-pencil-fill"></i> Update
						</a>
						<a th:href="@{/deleteStudent/{id}(id=${student.id})}" 
							class="btn btn-danger btn-sm">
							<i class="bi bi-trash-fill"></i> Delete
						</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>

</html>
